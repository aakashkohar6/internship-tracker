services:
  db:
    image: mariadb:11.4

    environment:
      MARIADB_DATABASE: internship_tracker
      MARIADB_USER: internship_app_user
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/compose-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "9090:8080"
    environment:
      DB_URL: jdbc:mariadb://db:3306/internship_tracker
      DB_PASSWORD: ${DB_PASSWORD}

    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:

