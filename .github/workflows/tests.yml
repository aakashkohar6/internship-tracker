name: Java CI
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Initialize test database
        run: |
          docker exec -i ${{ job.services.mariadb.id }} \
            mariadb -u internship_app_user -pci_test_password \
            internship_tracker_test < database/init.sql

      - name: Run Maven tests
        run: mvn test

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci_root_password
          MARIADB_DATABASE: internship_tracker_test
          MARIADB_USER: internship_app_user
          MARIADB_PASSWORD: ci_test_password

        ports:
          - 3306:3306

        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_URL: jdbc:mariadb://localhost:3306/internship_tracker_test
      DB_PASSWORD: ci_test_password